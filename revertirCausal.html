<div class="container mt-5 text-center">
  <fieldset class="border p-3 mb-3">
    <legend >Revertir Causal</legend>
    <div class="row  justify-content-center">
      <div class="col-md-2  mt-1">
        <div class="form-group">
          <label class="has-float-label" title="Canasta">
            <select id="canastaSelect" class="form-select sel" aria-label="Seleccionar canasta" required data-placeholder="Seleccionar opción">
              <option value="" disabled selected>Seleccionar canasta</option>
            </select>
            <span>Canasta:</span>
          </label>
        </div>
      </div>
      <div class="col-md-2  mt-1">
        <div class="form-group">
          <label class="has-float-label" data-toggle="tooltip" data-placement="top" title="Municipio">
            <select id="municipioSelect" class="form-select sel" aria-label="Default select example" required>
            </select>
            <span>Municipio:</span>
          </label>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-group">
          <label class="has-float-label" data-toggle="tooltip" data-placement="top" title="Establecimiento">
            <select id="establecimientoSelect" class="form-select sel" aria-label="Default select example" required disabled>
            </select>
            <span>Establecimiento:</span>
          </label>
        </div>
      </div>
    </div>
  </fieldset>

  <div class="row  justify-content-center mt-1">   
    <div class="col-md-6 d-flex justify-content-center">
      <button type="button" class="btn btn-danger" id="eliminarBtn" data-tabcontinuar="data-tabcontinuar">
        <span>Revertir</span> 
        <span class="fa fa-database"></span>
      </button>
    </div>
   </div>
</div>
